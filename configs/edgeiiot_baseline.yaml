# Week 1 baseline: FedAvg on Edge-IIoTset (network intrusion detection, 15 classes).
# Prepare the data once first:
#   python scripts/prepare_edgeiiot.py --csv data/DNN-EdgeIIoT-dataset.csv --out data/edgeiiot

run_name: edgeiiot_baseline

data:
  dataset: edgeiiot
  data_dir: ./data/edgeiiot   # output folder of prepare_edgeiiot.py
  alpha: 0.5                  # Dirichlet alpha: smaller = more uneven (non-IID) data
  min_samples_per_node: 100

model: mlp                    # small fully connected network (90 features -> 15 classes)

federation:
  num_nodes: 20
  nodes_per_round: 10
  num_rounds: 100

training:
  local_epochs: 1
  batch_size: 256             # rows are small, so bigger batches than for images
  learning_rate: 0.01
  device: cpu

methods:
  selection: random
  scoring: none
  aggregation: fedavg

simulation:
  cpus_per_node: 1

seed: 0
