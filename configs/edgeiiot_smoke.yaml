# Quick check on the 5% Edge-IIoTset sample: a few nodes, a few rounds.
# Prepare the sample first:
#   python scripts/prepare_edgeiiot.py --csv data/edge_sample_5pct.csv --out data/edgeiiot_sample

run_name: edgeiiot_smoke

data:
  dataset: edgeiiot
  data_dir: ./data/edgeiiot_sample
  alpha: 0.5
  min_samples_per_node: 50

model: mlp

federation:
  num_nodes: 5
  nodes_per_round: 3
  num_rounds: 3

training:
  local_epochs: 1
  batch_size: 256
  learning_rate: 0.01
  device: cpu

methods:
  selection: random           # random | slack
  scoring: none
  aggregation: fedavg          # fedavg | krum | trimmed_mean
  assumed_malicious_fraction: 0.2   # what Krum / trimmed mean are told to expect
                                    # (the true fraction, also used in no-attack runs)

attack:
  type: none                   # none | label_flip | scaling | free_rider | on_off
  fraction: 0.2                # share of fog nodes that are malicious (4 of 20)
  source_class: Backdoor       # label_flip: this attack class is relabelled as...
  target_class: Normal         #             ...Normal
  scale: -1.0                  # scaling / on_off: sent = global + scale * (local - global)
  honest_rounds: 10            # on_off: honest for 10 rounds,
  attack_rounds: 5             #         then attacking for 5, repeated
  noise_std: 0.0               # free_rider: 0 = return the global model unchanged

workload:                      # real-time workload model (src/bcfl/workload.py). RTH2S = Kaur et al. 2023
  enabled: false               # true = simulate each fog node's real-time jobs every round
  training_policy: fair_share  # fair_share (training is an ordinary process) | edf (training is an EDF job)
  round_window_s: 60.0         # one FL round; training not done by then is too late
  mips: [1000, 2000]           # RTH2S tier-1 fog node speed
  small_job_mi: [155, 250]     # RTH2S Table 2 (sensing)
  medium_job_mi: [1850, 3000]  # RTH2S Table 2 (control, object recognition)
  small_job_share: 0.55        # RTH2S mix 41:34 (its large jobs run on higher tiers)
  small_deadline_s: [0.25, 2.0]    # inside RTH2S's 250 ms - 10 s
  medium_deadline_s: [4.0, 10.0]   # inside RTH2S's 250 ms - 10 s
  deadline_factor: 1.0         # RTH2S DF: deadlines divided by this (1-5)
  normal_load: [0.2, 0.5]      # share of CPU real-time jobs need in a normal round
  busy_load: [0.8, 0.95]       # ... and in a busy round
  p_normal_to_busy: 0.2        # chance per round of becoming busy
  p_busy_to_normal: 0.5        # chance per round of calming down (=> about 29% busy rounds)
  ops_per_weight_per_row: 6    # training cost: forward + backward pass

simulation:
  cpus_per_node: 1

seed: 0
